<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6">
    <div class="w-full max-w-4xl space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400">Autonomous Deep Research Agent</h1>
            <p class="text-slate-400 text-sm">Enter a topic to generate comprehensive, multi-source research reports.</p>
        </header>

        <!-- Input Form -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Research Query</label>
                <input type="text" id="queryInput" placeholder="e.g., State of Agentic AI workflows in 2026..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="startResearch()" id="submitBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 font-medium py-3 rounded-lg transition-colors shadow-md">
                Start Research
            </button>
        </div>

        <!-- Status & Output Section -->
        <div id="statusSection" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-xl text-center text-indigo-300 animate-pulse">
            Synthesizing research findings... This may take a moment.
        </div>

        <div id="resultSection" class="hidden bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-lg prose prose-invert max-w-none">
            <div id="reportContent"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
